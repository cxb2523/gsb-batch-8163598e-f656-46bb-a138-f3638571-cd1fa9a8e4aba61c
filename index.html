<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fold Studio — Make it yours</title><link rel="icon" href="/favicon.svg"><meta name="description" content="Make a personal gift box or small-brand package. Design on a 3D box and print its matching paper template."><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="wordmark" href="/">Fold<span>®</span></a><div class="header-actions"><button id="loadProject">Open project</button><button id="saveProject">Save project ↗</button></div></header>
<main><div class="workspace"><div class="intro"><div><h1>Make it personal</h1></div></div><section class="preview-card" aria-label="Box design preview"><div class="stage-top"><div class="view-switch"><button data-view="box" class="active">3D box</button><button data-view="net">Print layout</button></div><div class="history-actions"><button id="undoAction" class="icon-button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button><button id="redoAction" class="icon-button" title="Redo (Ctrl+Shift+Z / Ctrl+Y)" aria-label="Redo" disabled>↷</button></div><div class="stage-actions"><button id="openBoxBtn" aria-expanded="false" aria-controls="gl">Open box ↗</button><button id="resetView" class="icon-button" title="Reset camera">↺</button></div></div><div id="stage"><canvas id="gl" aria-label="Interactive 3D box. Click or press Enter to open and close. Drag to rotate. Scroll to zoom."></canvas><canvas id="net" hidden aria-label="Printable box layout"></canvas><div id="stageHint">Drag to rotate · Click a face to design</div></div><div id="openingGuide" class="opening-guide" hidden></div><div class="stage-bottom"><div id="constructionStatus" class="construction-status"></div><button id="foldBtn">Unfold the box ↗</button><span id="dimensionsReadout"></span></div></section><div class="below"><p id="contextHint">Choose a shape, then make it yours.</p><button id="downloadShot">Save preview ↓</button></div></div>
<aside><nav id="steps" aria-label="Design steps"></nav><div id="panel"></div><div class="step-footer"><button id="previous">Back</button><button id="next" class="primary">Continue →</button></div></aside></main>
<div id="toast" role="status" aria-live="polite"></div><input id="projectFile" type="file" accept="application/json" hidden>

<dialog id="shapeDialog"><div class="dialog-head"><div><p class="eyebrow">The shape collection</p><h2>Choose a shape</h2></div><button id="closeShapes" aria-label="Close shape collection">Close ×</button></div><div class="catalog-tools"><input id="catalogSearch" type="search" placeholder="Find a shape or a use…" aria-label="Search box shapes"><select id="catalogFamily" aria-label="Filter shapes"><option value="all">All shapes</option><option>Everyday</option><option>Gift</option><option>Carry</option><option>Retail</option><option>Food</option></select></div><div id="catalogGrid" class="form-grid"></div></dialog>
<dialog id="checksDialog"><div class="dialog-head"><div><p class="eyebrow">Construction evidence</p><h2 id="checksTitle">Geometry checks</h2></div><button id="closeChecks">Close ×</button></div><div id="checksContent"></div></dialog>
<script type="module" src="/app.js"></script></body></html>
