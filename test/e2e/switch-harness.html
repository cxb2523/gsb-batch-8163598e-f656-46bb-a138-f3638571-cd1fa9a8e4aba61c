<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>BVB context-switch harness</title>
  <style>
    html, body { margin: 0; background: #0d0e13; color: #ddd; font-family: sans-serif; }
    video { display: block; width: 640px; height: 360px; margin: 24px auto; background: #000; }
    video.hidden { display: none; }
    .up-name { display: block; text-align: center; color: #4af; }
    .video-title { text-align: center; }
    #log { width: 900px; margin: 0 auto 40px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1 class="video-title" title="切换测试稿件">切换测试稿件</h1>
  <!-- 初始只有 A 可见；用例也可以切换到 B 元素，验证“换一个 video 元素”走同一路径。 -->
  <video id="video-a" src="level-test.webm?init=a" width="640" height="360" autoplay playsinline controls></video>
  <video id="video-b" class="hidden" src="level-test.webm?init=b" width="640" height="360" playsinline controls></video>
  <a id="up-link" class="up-name" href="https://space.bilibili.com/0" style="display:none">UP</a>
  <pre id="log"></pre>

  <script>
    window.__BVB_TEST__ = true;
    window.__BVB_WORKLET_URL__ = '../../src/loudness-worklet.js';
    window.__bvbTimeline = [];
  </script>
  <script src="../../src/content.js"></script>
  <script>
    // 模拟一次用户手势，让 AudioContext 启动。
    setTimeout(() => {
      document.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, cancelable: true, pointerType: 'mouse',
      }));
    }, 300);

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    window.__h = {
      sleep,

      async waitFor(fn, { timeout = 8000, interval = 50, label = 'condition' } = {}) {
        const deadline = performance.now() + timeout;
        let lastError = null;
        while (performance.now() < deadline) {
          try {
            const value = fn();
            if (value) return value;
          } catch (error) {
            lastError = error;
          }
          await sleep(interval);
        }
        const debug = window.__bvbDebug ? window.__bvbDebug() : null;
        throw new Error(`waitFor 超时：${label} ${lastError ? lastError.message : ''} debug=${JSON.stringify(debug)}`);
      },

      async ready() {
        return this.waitFor(() => {
          const d = window.__bvbDebug();
          return d && d.ctxState === 'running' && d.source === true && d.generation >= 2 ? d : null;
        }, { timeout: 20000, label: 'audio graph attached' });
      },

      setContext(bv, mid, upName) {
        const url = bv ? `${location.pathname}?bvid=${bv}` : location.pathname;
        history.replaceState(null, '', url);
        const anchor = document.getElementById('up-link');
        if (mid) {
          anchor.href = `https://space.bilibili.com/${mid}`;
          anchor.textContent = upName || `UP ${mid}`;
          anchor.style.display = 'block';
        } else {
          anchor.removeAttribute('href');
          anchor.textContent = '';
          anchor.style.display = 'none';
        }
      },

      seedCache(entries) {
        const now = Date.now();
        const cache = {};
        for (const [key, lufs] of Object.entries(entries || {})) {
          cache[key] = { lufs, ts: now, title: key, up: 'seed' };
        }
        window.__bvbSetCache(cache);
        return cache;
      },

      lastAlignFor(bv) {
        const aligns = (window.__bvbTimeline || []).filter((e) => e.type === 'context-align');
        for (let i = aligns.length - 1; i >= 0; i -= 1) {
          if (aligns[i].bv === bv) return aligns[i];
        }
        return null;
      },

      // 等待“统一对齐路径”确实以目标 BV 跑过，而不只是 URL 变了。
      alignedDebug(bv, tag) {
        const d = window.__bvbDebug();
        if (!d || d.bv !== bv) return null;
        if (tag && (!d.video || !d.video.includes(tag))) return null;
        const last = (window.__bvbTimeline || []).filter((e) => e.type === 'context-align').slice(-1)[0];
        if (!last || last.bv !== bv || last.generation !== d.generation) return null;
        return d;
      },

      async switchSame({ bv, mid, up, tag }) {
        this.setContext(bv, mid, up);
        const a = document.getElementById('video-a');
        document.getElementById('video-b').classList.add('hidden');
        a.classList.remove('hidden');
        a.src = `level-test.webm?${tag}`;
        a.load();
        try { await a.play(); } catch {}
        const d = await this.waitFor(() => this.alignedDebug(bv, tag), {
          timeout: 8000, label: `same-element switch ${tag}`,
        });
        await sleep(20);
        return window.__bvbDebug();
      },

      async switchElement({ bv, mid, up, tag }) {
        this.setContext(bv, mid, up);
        const a = document.getElementById('video-a');
        const b = document.getElementById('video-b');
        try { a.pause(); } catch {}
        a.classList.add('hidden');
        b.classList.remove('hidden');
        b.src = `level-test.webm?${tag}`;
        b.load();
        try { await b.play(); } catch {}
        const d = await this.waitFor(() => this.alignedDebug(bv, tag), {
          timeout: 12000, label: `element switch ${tag}`,
        });
        await sleep(20);
        return window.__bvbDebug();
      },

      panel() {
        const host = document.getElementById('bvb-panel-host');
        const root = host && host.shadowRoot;
        const get = (id) => {
          const el = root && root.getElementById(id);
          return el ? el.textContent : null;
        };
        return {
          status: get('bvb-status'),
          foot: get('bvb-foot'),
          lufs: get('bvb-lufs-value'),
          gain: get('bvb-gain'),
        };
      },

      clickReset() {
        const host = document.getElementById('bvb-panel-host');
        const btn = host && host.shadowRoot && host.shadowRoot.getElementById('bvb-reset');
        if (btn) btn.click();
        return this.panel();
      },
    };
  </script>
</body>
</html>
